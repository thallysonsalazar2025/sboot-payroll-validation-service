name: Pull Request CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests and security validation
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate Maven project
        run: ./mvnw --batch-mode --no-transfer-progress validate

      - name: Compile and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Enforce changed-code coverage
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check-diff-coverage.py
          --base "${{ github.event.pull_request.base.sha }}"
          --report target/site/jacoco/jacoco.xml

      - name: Verify negative coverage fixture
        run: python scripts/check-diff-coverage.py --self-test

      - name: Define vulnerability database cache key
        shell: bash
        run: echo "ODC_CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore vulnerability database cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-12.2.2-nist-feed-v1-${{ env.ODC_CACHE_DATE }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-12.2.2-nist-feed-v1-

      - name: Dependency vulnerability scan
        timeout-minutes: 65
        shell: bash
        run: |
          for attempt in 1 2; do
            ./mvnw --batch-mode --no-transfer-progress \
              org.owasp:dependency-check-maven:12.2.2:check && exit 0
            if [ "$attempt" -lt 2 ]; then
              echo "NVD update failed; retrying in 60 seconds (attempt $attempt/2)."
              sleep 60
            fi
          done
          exit 1

      - name: Verify required reports and package
        if: always()
        shell: bash
        run: |
          test -s target/site/jacoco/jacoco.xml
          test -s target/site/jacoco/index.html
          test -s target/dependency-check-report.html
          test -s target/dependency-check-report.json
          test -n "$(find target -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Record application SHA-256
        if: success()
        shell: bash
        run: sha256sum target/*.jar | tee target/application-sha256.txt

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-and-coverage-reports-${{ github.sha }}
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: error
          retention-days: 14

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report-${{ github.sha }}
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload immutable application artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-${{ github.sha }}
          path: |
            target/*.jar
            target/application-sha256.txt
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI / required
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every validation gate
        if: needs.validate.result != 'cancelled'
        shell: bash
        run: test "${{ needs.validate.result }}" = success
